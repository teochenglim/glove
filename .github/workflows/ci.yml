name: CI

# Hardening matrix (PRD §7 0.6.0, §8): full `make check` (incl. the perf
# gates) on ubuntu/amd64 + macos/arm64; windows/amd64 runs build + vet +
# short tests — spawn-latency benches are timing-sensitive and Windows
# process spawn is slower, so `go test -short` keeps them off that runner.
# The cross-compile job covers the remaining §8 targets (darwin/amd64,
# linux/arm64) as static builds. Trigger discipline (maintainer decision,
# 2026-11-04): the matrix runs per release tag and on PRs — a release push
# lands the commit on main AND the tag, and running the identical matrix
# twice per release is pure duplicate compute.

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'

jobs:
  test:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, full: 'true' }
          - { os: macos-latest, full: 'true' }
          - { os: windows-latest, full: 'false' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: check (fmt, vet, ac-map, tests, version) # full gate with perf benches
        if: matrix.full == 'true'
        run: make check
      - name: windows gate (build, vet, short tests) # no make/goformat tooling on the runner
        if: matrix.full != 'true'
        run: |
          go build ./...
          go vet ./...
          go test -short ./...

  cross-compile:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Static build (CGO_ENABLED=0)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/glove
          echo "${{ matrix.goos }}/${{ matrix.goarch }} static build ok"

  decision-path-network:
    name: Decision path is loopback-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Build
        run: go build -o bin/glove ./cmd/glove
      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace
      - name: Hook under strace (no serve running)
        run: |
          echo '{"tool_name":"Bash","tool_input":{"command":"ls -la"}}' | \
            strace -f -e trace=network -o /tmp/strace.out ./bin/glove hook claude-code || true
          echo "--- network syscalls ---"
          cat /tmp/strace.out
          # PRD §3.3: zero non-loopback network on the decision path. Loopback
          # (hook→serve) is the only legal AF_INET/AF_INET6 traffic.
          if grep -E 'connect\(' /tmp/strace.out | grep -E 'AF_INET' | grep -vE '127\.0\.0\.1|::1|localhost'; then
            echo "::error::non-loopback connect() on the decision path"
            exit 1
          fi
          if grep -E 'sendto\(|sendmsg\(' /tmp/strace.out | grep -E 'AF_INET' | grep -vE '127\.0\.0\.1|::1'; then
            echo "::error::non-loopback send on the decision path"
            exit 1
          fi
          echo "decision path is loopback-only ✓"

  supply-chain:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: govulncheck (Go vulnerability database)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ''
          check-latest: false
