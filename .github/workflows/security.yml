name: Security

# SAST, dependency and container scanning. Findings go to the repository's Security tab
# (SARIF) and fail the job on CRITICAL/HIGH.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 6 AM UTC: new CVEs appear without code changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Semgrep SAST ────────────────────────────────────────────────────────────
  #
  # Registry packs for the language and the OWASP basics, IN ADDITION to the
  # vendored project rules in .semgrep/rules.yaml (five --config lines; keep
  # all of them — the vendored file extends, never replaces, the packs). The
  # vendored rules enforce Glove's core invariant: the guard never executes
  # an agent-proposed command (go-command-injection).
  # SEMGREP_APP_TOKEN is optional: set it in repo secrets to push results to
  # Semgrep Cloud. Without it, findings are printed to the log and uploaded
  # as SARIF.

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan
        run: |
          semgrep scan \
            --config p/golang \
            --config p/sql-injection \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config .semgrep/rules.yaml \
            --exclude bin \
            --exclude dist \
            --sarif \
            --output semgrep.sarif \
            --error
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true   # private repo: Code Scanning needs GHAS; never block on the upload
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ── Trivy: dependency + filesystem scan ─────────────────────────────────────
  #
  # Scans go.mod / go.sum and the repo for known CVEs. Fails on CRITICAL or HIGH.
  # Complements govulncheck in ci.yml (different advisory sources).
  # Runs the official trivy CONTAINER (digest-pinned from GHCR) instead of
  # aquasecurity/setup-trivy: setup-trivy's release-asset download failed on
  # three consecutive runs (curl exit 6) — registry pulls are the reliable path.

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c # v0.76.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The vuln DB is re-downloaded per run otherwise; restore-keys picks the
      # newest cached DB (inside the mounted workspace so the container sees it).
      - name: Cache Trivy DB
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Scan filesystem (fail on CRITICAL/HIGH CVEs)
        run: |
          docker run --rm -v "$PWD":/workdir -w /workdir "$TRIVY_IMAGE" \
            fs --cache-dir /workdir/.cache/trivy --severity CRITICAL,HIGH \
            --scanners vuln --exit-code 1 .

      - name: Scan filesystem (SARIF, uploaded to the Security tab)
        if: always()
        run: |
          docker run --rm -v "$PWD":/workdir -w /workdir "$TRIVY_IMAGE" \
            fs --cache-dir /workdir/.cache/trivy --severity CRITICAL,HIGH \
            --scanners vuln --format sarif --output /workdir/trivy-fs.sarif .

      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true   # private repo: Code Scanning needs GHAS; never block on the upload
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ── Trivy: container image ──────────────────────────────────────────────────
  #
  # Builds the release image (not pushed) and scans the OS layer and the binary.
  # distroless/static keeps the OS surface minimal; this catches base-image CVEs between releases.

  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c # v0.76.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Trivy DB
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Build image (local only, not pushed)
        run: docker build --build-arg VERSION=security-scan -t glove:scan .

      # The docker socket is mounted so the container can see the locally
      # built glove:scan image.
      - name: Scan image (fail on CRITICAL/HIGH CVEs)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/workdir -w /workdir "$TRIVY_IMAGE" \
            image --cache-dir /workdir/.cache/trivy --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 glove:scan

      - name: Scan image (SARIF, uploaded to the Security tab)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/workdir -w /workdir "$TRIVY_IMAGE" \
            image --cache-dir /workdir/.cache/trivy --severity CRITICAL,HIGH \
            --ignore-unfixed --format sarif --output /workdir/trivy-image.sarif glove:scan

      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true   # private repo: Code Scanning needs GHAS; never block on the upload
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
