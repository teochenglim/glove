name: Security

# SAST, dependency and container scanning. Findings go to the repository's Security tab
# (SARIF) and fail the job on CRITICAL/HIGH.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 6 AM UTC: new CVEs appear without code changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Semgrep SAST ────────────────────────────────────────────────────────────
  #
  # Registry packs for the language and the OWASP basics, IN ADDITION to the
  # vendored project rules in .semgrep/rules.yaml (five --config lines; keep
  # all of them — the vendored file extends, never replaces, the packs). The
  # vendored rules enforce Glove's core invariant: the guard never executes
  # an agent-proposed command (go-command-injection).
  # SEMGREP_APP_TOKEN is optional: set it in repo secrets to push results to
  # Semgrep Cloud. Without it, findings are printed to the log and uploaded
  # as SARIF.

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan
        run: |
          semgrep scan \
            --config p/golang \
            --config p/sql-injection \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config .semgrep/rules.yaml \
            --exclude bin \
            --exclude dist \
            --sarif \
            --output semgrep.sarif \
            --error
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true   # private repo: Code Scanning needs GHAS; never block on the upload
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ── Trivy: dependency + filesystem scan ─────────────────────────────────────
  #
  # Scans go.mod / go.sum and the repo for known CVEs. Fails on CRITICAL or HIGH.
  # Complements govulncheck in ci.yml (different advisory sources).

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The vuln DB is re-downloaded per run otherwise; GH release downloads
      # are the flaky part (both v0.1.0/v0.2.0 security failures were DB
      # fetches, not findings). restore-keys picks the newest cached DB; a
      # fresh one is saved on success.
      - name: Cache Trivy DB
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Scan filesystem (fail on CRITICAL/HIGH CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Scan filesystem (SARIF, uploaded to the Security tab)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true   # private repo: Code Scanning needs GHAS; never block on the upload
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ── Trivy: container image ──────────────────────────────────────────────────
  #
  # Builds the release image (not pushed) and scans the OS layer and the binary.
  # distroless/static keeps the OS surface minimal; this catches base-image CVEs between releases.

  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Trivy DB
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Build image (local only, not pushed)
        run: docker build --build-arg VERSION=security-scan -t glove:scan .

      - name: Scan image (fail on CRITICAL/HIGH CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: glove:scan
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan image (SARIF, uploaded to the Security tab)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: glove:scan
          format: sarif
          output: trivy-image.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true   # private repo: Code Scanning needs GHAS; never block on the upload
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
